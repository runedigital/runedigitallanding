<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNE Digital - Artifact Entry</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;700&family=Cinzel:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #020202;
            color: #c5a059;
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 1;
            background-size: 100% 2px;
            pointer-events: none;
        }
        
        .artifact-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        
        .artifact {
            width: 300px;
            height: 300px;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s;
        }
        
        .artifact:hover {
            transform: scale(1.05);
        }
        
        .artifact-core {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Shatter effect - fragments */
        .fragment {
            position: absolute;
            background: rgba(197, 160, 89, 0.3);
            border: 1px solid #c5a059;
            opacity: 1;
        }
        
        .artifact.shattered .fragment {
            animation: shatter 0.8s ease-out forwards;
        }
        
        @keyframes shatter {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.3);
            }
        }
        
        .artifact-inner {
            width: 250px;
            height: 250px;
            border: 2px solid #c5a059;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at 30% 30%, rgba(197, 160, 89, 0.1), transparent);
            box-shadow: inset 0 0 30px rgba(197, 160, 89, 0.2);
        }
        
        .artifact.shattered .artifact-inner {
            animation: fadeOut 0.4s ease-out forwards;
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }
        
        .artifact-symbol {
            font-size: 120px;
            color: #c5a059;
            opacity: 0.8;
            text-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
        }
        
        .artifact-label {
            font-size: 14px;
            letter-spacing: 2px;
            color: #c5a059;
            opacity: 0.6;
            margin-top: 20px;
            text-align: center;
        }
        
        .artifact.shattered .artifact-label {
            opacity: 0;
        }
        
        .initialize-btn {
            background: transparent;
            border: 2px solid #c5a059;
            color: #c5a059;
            padding: 15px 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .artifact.shattered ~ .initialize-btn,
        .initialize-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .initialize-btn:hover {
            background: #c5a059;
            color: #020202;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
        }
        
        .instruction {
            color: rgba(197, 160, 89, 0.6);
            font-size: 11px;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeInInstruction 0.5s ease-out 0.3s forwards;
        }
        
        @keyframes fadeInInstruction {
            to {
                opacity: 1;
            }
        }
        
        .artifact.shattered ~ .instruction {
            animation: fadeOutInstruction 0.3s ease-out forwards;
        }
        
        @keyframes fadeOutInstruction {
            to {
                opacity: 0;
            }
        }

    </style>
</head>
<body>
    <div class="scanlines"></div>
    
    <div class="artifact-container">
        <div class="artifact" id="mainArtifact">
            <div class="artifact-core">
                <div class="artifact-inner">
                    <div class="artifact-symbol">◇</div>
                </div>
            </div>
            <div class="artifact-label">Click to Initialize</div>
        </div>
        
        <p class="instruction">CLICK THE ARTIFACT TO PROCEED →</p>
        
        <a href="research-hub.html" class="initialize-btn">INITIALIZE SYSTEM</a>
    </div>
    
    <script>
        const artifact = document.getElementById('mainArtifact');
        const initBtn = document.querySelector('.initialize-btn');
        
        function createShatterEffect() {
            const core = artifact.querySelector('.artifact-core');
            const rect = core.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Create fragments
            const fragmentCount = 12;
            for (let i = 0; i < fragmentCount; i++) {
                const fragment = document.createElement('div');
                fragment.className = 'fragment';
                
                const size = Math.random() * 40 + 20;
                fragment.style.width = size + 'px';
                fragment.style.height = size + 'px';
                
                const angle = (i / fragmentCount) * Math.PI * 2;
                const distance = Math.random() * 200 + 150;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                fragment.style.setProperty('--tx', tx + 'px');
                fragment.style.setProperty('--ty', ty + 'px');
                
                const randomX = (Math.random() - 0.5) * 100;
                const randomY = (Math.random() - 0.5) * 100;
                fragment.style.left = (centerX - rect.left + randomX) + 'px';
                fragment.style.top = (centerY - rect.top + randomY) + 'px';
                
                core.appendChild(fragment);
            }
            
            // Trigger animation
            setTimeout(() => {
                artifact.classList.add('shattered');
                initBtn.classList.add('visible');
            }, 50);
        }
        
        artifact.addEventListener('click', () => {
            if (!artifact.classList.contains('shattered')) {
                createShatterEffect();
            }
        });
        
        // Also allow clicking the button to proceed
        initBtn.addEventListener('click', (e) => {
            if (initBtn.classList.contains('visible')) {
                window.location.href = 'research-hub.html';
            }
        });
    </script>
</body>
</html>
