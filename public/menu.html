<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNE // MENU</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=JetBrains+Mono:wght@300;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #020202;
            color: #c5a059;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            height: 100vh;
        }
        
        /* --- SCANLINES & VIGNETTE --- */
        body::after {
            content: "";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 90;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 60%, black 100%);
            z-index: 80; pointer-events: none;
        }
        
        /* --- CURSOR --- */
        #cursor {
            position: fixed; top: 0; left: 0; width: 12px; height: 12px;
            border: 1px solid #c5a059; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 9999;
        }
        
        /* --- HUD CORNERS --- */
        .hud {
            position: fixed; font-size: 10px; color: #555; z-index: 85; pointer-events: none;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .tl { top: 30px; left: 30px; border-top: 1px solid #333; border-left: 1px solid #333; padding: 10px; }
        .tr { top: 30px; right: 30px; border-top: 1px solid #333; border-right: 1px solid #333; padding: 10px; text-align: right; }
        .bl { bottom: 30px; left: 30px; border-bottom: 1px solid #333; border-left: 1px solid #333; padding: 10px; }
        .br { bottom: 30px; right: 30px; border-bottom: 1px solid #333; border-right: 1px solid #333; padding: 10px; text-align: right; }
        
        /* --- MENU CONTAINER --- */
        .menu-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; z-index: 50;
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out 0.5s forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            color: #eee;
            margin: 0 0 30px 0;
            letter-spacing: 0.3em;
            text-shadow: 0 0 30px rgba(197, 160, 89, 0.3);
        }
        
        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 0.5em;
            color: #c5a059;
            margin: 0 0 80px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 15px 0;
            display: inline-block;
        }
        
        /* --- MENU OPTIONS --- */
        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 0.85rem;
            letter-spacing: 2px;
        }
        
        .menu-item-number {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: #c5a059;
            width: 40px;
            text-align: right;
        }
        
        .menu-item-line {
            width: 120px;
            height: 1px;
            background: rgba(197, 160, 89, 0.3);
        }
        
        .menu-link {
            color: #c5a059;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            padding: 8px 20px;
            border: 1px solid transparent;
            background: rgba(0, 0, 0, 0.8);
        }
        
        .menu-link:hover {
            background: #c5a059;
            color: #000;
            border-color: #c5a059;
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.4);
        }
        
        /* --- BOTTOM INFO --- */
        .menu-footer {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 10px;
            color: #555;
            letter-spacing: 2px;
            z-index: 85;
        }
        
    </style>
</head>
<body>
    
    <div class="vignette"></div>
    <div id="cursor"></div>
    
    <!-- HUD ELEMENTS -->
    <div class="hud tl">SYS.ROOT<br>ID: RUNE</div>
    <div class="hud tr">LATENCY: 12ms<br>SECURE</div>
    <div class="hud bl">COORDS: <span id="xy">0,0</span></div>
    <div class="hud br">VER 2.4.0<br>STABLE</div>
    
    <!-- MENU -->
    <div class="menu-container">
        <h1>RUNE</h1>
        <div class="subtitle">DIGITAL ARCHITECT</div>
        
        <div class="menu-options">
            <div class="menu-item">
                <div class="menu-item-number">01</div>
                <div class="menu-item-line"></div>
                <a href="index.html" class="menu-link">RESEARCH HUB</a>
            </div>
            <div class="menu-item">
                <div class="menu-item-number">02</div>
                <div class="menu-item-line"></div>
                <a href="#" class="menu-link">DOCUMENTATION</a>
            </div>
            <div class="menu-item">
                <div class="menu-item-number">03</div>
                <div class="menu-item-line"></div>
                <a href="#" class="menu-link">CONTACT</a>
            </div>
        </div>
    </div>
    
    <div class="menu-footer">
        RUNE DIGITAL // 2025<br>
        <span style="opacity: 0.5;">[ INITIALIZED ]</span>
    </div>
    
    <script>
        // Cursor tracking
        const cursor = document.getElementById('cursor');
        const xy = document.getElementById('xy');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            xy.innerText = `${e.clientX},${e.clientY}`;
        });
    </script>
    
</body>
</html>
