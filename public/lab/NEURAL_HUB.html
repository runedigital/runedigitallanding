<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f0f1e 100%);
            color: #00ffea;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }
        
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        header {
            padding: 20px;
            border-bottom: 2px solid #00ffea;
            background: rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        
        h1 {
            font-size: 32px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #00ffea, 0 0 40px #00ffea;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 20px #00ffea, 0 0 40px #00ffea; }
            50% { text-shadow: 0 0 10px #00ffea, 0 0 20px #00ffea; }
        }
        
        .status-bar {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 1px solid #00ffea;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff44;
            border-radius: 50%;
            margin-right: 5px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }
        
        main {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
            overflow-y: auto;
        }
        
        .node {
            background: linear-gradient(135deg, rgba(0, 255, 234, 0.05), rgba(255, 0, 85, 0.05));
            border: 2px solid #00ffea;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .node::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 234, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .node:hover::before {
            left: 100%;
        }
        
        .node:hover {
            border-color: #ff0055;
            box-shadow: 0 0 20px #00ffea, inset 0 0 20px rgba(0, 255, 234, 0.1);
            transform: translateY(-5px);
            background: linear-gradient(135deg, rgba(0, 255, 234, 0.1), rgba(255, 0, 85, 0.1));
        }
        
        .node h3 {
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #00ffea;
        }
        
        .node p {
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }
        
        .node.classified {
            border-color: #555;
            color: #666;
        }
        
        .node.classified h3 {
            color: #555;
        }
        
        .node.classified:hover {
            border-color: #555;
            box-shadow: none;
        }
        
        footer {
            padding: 15px 20px;
            border-top: 1px solid #00ffea;
            background: rgba(0, 0, 0, 0.5);
            font-size: 12px;
            text-align: right;
        }
        
        footer a {
            color: #00ffea;
            text-decoration: none;
            margin-left: 20px;
        }
        
        footer a:hover {
            color: #ff0055;
        }
        
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffea;
            text-decoration: none;
            border: 1px solid #00ffea;
            padding: 8px 15px;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.3s;
            z-index: 100;
        }
        
        .back-link:hover {
            background: #00ffea;
            color: #000;
        }
    </style>
</head>
