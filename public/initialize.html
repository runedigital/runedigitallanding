<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNE Digital - Initialize</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;700&family=Cinzel:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            color: #c5a059;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            margin: 0;
            width: 100vw;
            height: 100vh;
        }
        
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 10;
            background-size: 100% 2px;
            pointer-events: none;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .init-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
            z-index: 5;
            pointer-events: none;
        }
        
        .init-header {
            text-align: center;
            margin-top: 60px;
        }
        
        .init-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: #c5a059;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
        }
        
        .init-header p {
            font-size: 12px;
            letter-spacing: 3px;
            color: #888;
            text-transform: uppercase;
        }
        
        .init-content {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        
        .init-status {
            font-size: 11px;
            letter-spacing: 1px;
            color: #c5a059;
            line-height: 1.8;
            min-height: 80px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 20px 30px;
            background: rgba(197, 160, 89, 0.03);
            max-width: 500px;
        }
        
        .coord-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: #888;
            opacity: 0.6;
        }
        
        .init-instruction {
            font-size: 12px;
            letter-spacing: 2px;
            color: #999;
            margin-top: 20px;
            text-transform: uppercase;
        }
        
        .init-button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        
        .init-btn {
            padding: 18px 40px;
            border: 2px solid #c5a059;
            background: transparent;
            color: #c5a059;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }
        
        .init-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #c5a059;
            z-index: -1;
            transition: left 0.4s;
        }
        
        .init-btn:hover::before {
            left: 0;
        }
        
        .init-btn:hover {
            color: #000;
            box-shadow: 0 0 40px rgba(197, 160, 89, 0.5);
        }
        
        .init-btn-secondary {
            border: 1px solid rgba(197, 160, 89, 0.5);
            padding: 12px 30px;
            font-size: 10px;
            background: rgba(197, 160, 89, 0.03);
        }
        
        .init-btn-secondary:hover {
            background: #c5a059;
            color: #000;
            border-color: #c5a059;
        }
        
        .init-footer {
            text-align: center;
            font-size: 10px;
            letter-spacing: 1px;
            color: #666;
        }
        
        .init-footer p {
            margin: 5px 0;
        }
        
        .init-footer a {
            color: #c5a059;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .init-footer a:hover {
            color: #fff;
        }
        
        /* Blinking cursor effect */
        .cursor {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        
        /* Grid background */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(197, 160, 89, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(197, 160, 89, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <canvas id="canvas"></canvas>
    
    <div class="scanlines"></div>
    
    <div class="init-ui">
        <div class="init-header">
            <h1>RUNE DIGITAL</h1>
            <p>ENTERPRISE AI ORCHESTRATION PLATFORM</p>
        </div>
        
        <div class="init-content">
            <div class="init-status">
                <div>// SYSTEM STATUS: INITIALIZING...</div>
                <div style="margin-top: 10px;">// CONNECTING NEURAL PATHWAYS</div>
                <div style="margin-top: 10px;">// LOADING ORCHESTRATION ARCHITECTURE</div>
                <div style="margin-top: 10px;">READY<span class="cursor">_</span></div>
                <div class="coord-display" style="margin-top: 15px;" id="coords">[0,0]</div>
            </div>
            
            <div class="init-instruction">
                CLICK ANYWHERE TO INITIALIZE
            </div>
            
            <div class="init-button-group">
                <button class="init-btn" onclick="proceedToLanding()">PROCEED</button>
                <button class="init-btn init-btn-secondary" onclick="openShowroom()">SHOWROOM</button>
            </div>
        </div>
        
        <div class="init-footer">
            <p>RUNE Digital © 2025</p>
            <p style="margin-top: 10px;">
                <a href="https://www.linkedin.com/company/rune-digital/" target="_blank">LINKEDIN</a>
                <span style="color: #333;">•</span>
                <a href="mailto:contact@runedigitalstudio.com">CONTACT</a>
            </p>
        </div>
    </div>

    <script>
        // Canvas setup for background animation
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let particles = [];
        let time = 0;
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 1.5;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.life = Math.random() * 200 + 100;
                this.maxLife = this.life;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    return false;
                }
                return true;
            }
            
            draw() {
                const alpha = (this.life / this.maxLife) * this.opacity;
                ctx.fillStyle = `rgba(197, 160, 89, ${alpha})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }
        
        function animate() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add occasional particles
            if (Math.random() < 0.3) {
                particles.push(new Particle());
            }
            
            // Update and draw particles
            particles = particles.filter(p => {
                if (p.update()) {
                    p.draw();
                    return true;
                }
                return false;
            });
            
            // Draw connecting lines
            ctx.strokeStyle = 'rgba(197, 160, 89, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        ctx.globalAlpha = 0.1 * (1 - dist / 100);
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // Mouse tracking for coordinate display
        document.addEventListener('mousemove', (e) => {
            const coordDisplay = document.getElementById('coords');
            coordDisplay.textContent = `[${Math.round(e.clientX)}, ${Math.round(e.clientY)}]`;
        });
        
        // Click anywhere initialization
        document.addEventListener('click', (e) => {
            // Optional: you could use coordinates for something, but button clicks should work fine
            const target = e.target;
            if (!target.classList.contains('init-btn') && !target.closest('a')) {
                proceedToLanding();
            }
        });
        
        // Navigation functions
        function proceedToLanding() {
            // Navigate to main landing page with card grid
            window.location.href = '/index.html';
        }
        
        function openShowroom() {
            window.location.href = '/showroom/';
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
